apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: edc-v

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

configMapGenerator:
  - name: edc-administration-api-client-config
    files:
      - application.yaml=application.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: edc-administration-api-client
      app.kubernetes.io/part-of: edc
